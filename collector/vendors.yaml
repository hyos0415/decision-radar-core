# 벤더 → 경로 매핑 (손으로 관리, docs/design/doc-pipeline.md §4-5 혼합 방식)
# 「어느 벤더를 볼지」는 규칙이 뽑는다: 대상 repo CLAUDE.md 「외부 모델·서비스」 ∪ 재검토 조건이 살아 있는 ADR의 기술.
# 규칙이 뽑은 이름이 아래 어느 벤더의 match에도 안 걸리면 「경로 없음」으로 보고한다.
#
# 경로 종류: github_releases (REST API — releases.atom은 최근 10건뿐이라 쓰지 않는다) · atom · rss (include로 거른다) · page (본문 텍스트를 받아 해시 — 비교는 스냅숏 단계)
version: 3  # 2: Gemini 마크다운 원문 · replaces (HYO-172) · 3: Anthropic · OpenAI 문서 주소 이동 (HYO-175~178)
vendors:
  anthropic:
    match: [anthropic, claude]
    feeds:
      # docs.claude.com → platform.claude.com 301 (W46 건강 검사가 처음 봤다 — 리다이렉트 기록이 W46부터라 옮긴 날은 모른다).
      # 본문은 정상이었다 — 옛 주소가 지난주까지 정상이면 옮긴 주는 지난주 본문과 줄 비교한다 (snapshot.backfill)
      - {kind: page, url: "https://platform.claude.com/docs/en/release-notes/overview", replaces: "https://docs.claude.com/en/release-notes/api"}
      - {kind: page, url: "https://platform.claude.com/docs/en/about-claude/model-deprecations", replaces: "https://docs.claude.com/en/docs/about-claude/model-deprecations"}
      - {kind: github_releases, repo: anthropics/claude-code}
  openai:
    match: [openai, gpt]
    feeds:
      # platform.openai.com/docs → developers.openai.com/api/docs 301 (위와 같음, HYO-177 · HYO-178)
      - {kind: page, url: "https://developers.openai.com/api/docs/changelog", replaces: "https://platform.openai.com/docs/changelog"}
      - {kind: page, url: "https://developers.openai.com/api/docs/deprecations", replaces: "https://platform.openai.com/docs/deprecations"}
      - {kind: github_releases, repo: openai/openai-agents-python}
  aws-bedrock:
    match: [bedrock]
    feeds:
      # 100건 ≈ 9일 분량이라 주 2회 돌린다 (run.py --sources vendor --only aws-bedrock)
      - {kind: rss, url: "https://aws.amazon.com/about-aws/whats-new/recent/feed/", include: "(?i)bedrock"}
  langfuse:
    match: [langfuse]
    feeds:
      - {kind: github_releases, repo: langfuse/langfuse}
      - {kind: page, url: "https://langfuse.com/changelog"}
  langchain:
    match: [langsmith, langgraph, langchain]
    feeds:
      - {kind: github_releases, repo: langchain-ai/langsmith-sdk}
      - {kind: github_releases, repo: langchain-ai/langgraph}
  google-gemini:
    match: [gemini, google-genai]
    feeds:
      # 2026-11-03(W45)부터 HTML 페이지가 aistudio.google.com으로 301 → JS로 그리는 페이지(본문 45자). 마크다운 원문으로 바꾼다 (HYO-172).
      # ai.google.dev/…/changelog.md.txt도 여기로 301이라 최종 주소를 바로 쓴다 — 리다이렉트가 매주 「도메인 바뀜」으로 울리지 않게.
      # replaces: 옛 주소 — 얼릴 때 옛 페이지를 「바뀜(replaced)」으로 두고, 마지막 정상 주 이후 날짜 블록만 page-diff로 메운다
      # (옛 주소가 지난주까지 정상이었으면 날짜로 메우지 않고 지난주 본문과 줄 비교 — 위 anthropic · openai)
      - {kind: page, format: markdown, url: "https://aistudio.google.com/docs/changelog.md", replaces: "https://ai.google.dev/gemini-api/docs/changelog"}
  typesafe:
    match: [jev, typesafe]
    feeds:
      # Mintlify 문서라 페이지마다 .md 원문이 있다 (llms.txt) — HTML이 아니라 그대로 비교한다
      # 확인 (2026-10-02): finance_verifier가 쓰는 모델 ID `jev-1.13.0`이 이 페이지의 Current models와 같다
      - {kind: page, format: markdown, url: "https://docs.typesafe.ai/models.md"}               # 모델 버전·가격·한도
      # SDK 변경 기록(/sdk/python/changelog)은 넣지 않는다 — PyPI가 가리키는 typesafe-ai/typesafe-sdk-python의
      # 릴리스가 GitHub 의존성 통로로 이미 들어온다 (중복)
  # ADR의 오픈소스 기술 — 대상 repo 의존성이 아니라서 GitHub 의존성 통로에 안 잡힌다 (2026-10-02 첫 실행에서 「경로 없음」)
  leann:
    match: [leann]
    feeds:
      - {kind: github_releases, repo: StarTrail-org/LEANN}   # yichuan-w/LEANN에서 옮겨짐
  kb-arena:
    match: [kb-arena]
    feeds:
      - {kind: github_releases, repo: xmpuspus/kb-arena}

# 일부러 뺀 것 (사용자 결정 2026-10-02) — 규칙이 뽑아도 「경로 없음」 대신 「제외」로 보고한다
excluded:
  - {match: [nvidia], why: "모델 페이지가 자바스크립트 렌더링이라 비교 불가 · eval 비교용"}
  - {match: [금융감독원, finlife], why: "데이터 의존성 — 바뀌면 fineprint 수집이 깨지며 레포에서 드러남"}
  - {match: [국가법령정보, 법령], why: "데이터 의존성"}

# 벤더가 아닌 것 — 규칙 입력에 섞여 들어오지만 볼 경로가 없는 게 정상이다
not_vendor:
  - {match: [localhost, 127.0.0.1, 로컬 전용], why: "로컬 서빙 모델 — 호스팅 벤더가 아니다 (공개 모델 소식은 HF 통로)"}
  - {match: [decision radar], why: "이 프로젝트 자신 (ADR 0010)"}
